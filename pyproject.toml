[project]
name = "stockmixer-soft-final"
version = "1.0.0"
description = "Leakage-safe StockMixer training with a differentiable competition-score proxy"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "swanlab>=0.9",
]

[project.urls]
"StockMixer upstream" = "https://github.com/SJTU-DMTai/StockMixer"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
