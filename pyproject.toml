description = "Causal axial Transformer for cross-sectional financial forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "swanlab>=0.9",
]

[project.urls]
Repository = "https://github.com/zeta172417-design/FinAxial"

[tool.pytest.ini_options]
testpaths = ["tests"]
